# PrusaSlicer — профиль для печати корпуса PUFVFD (PETG, сопло 0,4 мм). Используется build_stl.sh/проверкой;
# параметры подходят как отправная точка для любого слайсера.
layer_height = 0.2
first_layer_height = 0.24
perimeters = 4
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 25%
fill_pattern = gyroid
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.27
filament_type = PETG
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
support_material = 0
brim_width = 5
skirts = 1
perimeter_speed = 45
external_perimeter_speed = 30
infill_speed = 80
travel_speed = 150
max_print_height = 250
gcode_flavor = marlin2
