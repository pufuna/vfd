; PUFVFD — прошивка платы управления (WeAct Black Pill STM32F411CEU6, кварц 25 МГц)
; Сборка:    pio run
; Прошивка:  pio run -t upload            (ST-Link)
;            pio run -t upload --upload-protocol dfu   (USB, удерживая BOOT0 при сбросе)
[env:blackpill_f411ce]
platform = ststm32@17.6.0
board = blackpill_f411ce
framework = cmsis
upload_protocol = stlink
build_flags = -O2 -Wall -Wdouble-promotion -mfloat-abi=hard -mfpu=fpv4-sp-d16 -DHSE_VALUE=25000000
extra_scripts = hardfloat.py
