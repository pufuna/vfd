; PUFVFD — модуль связи (ESP32 DevKit): веб-интерфейс по Wi-Fi, Bluetooth-консоль, шлюз Modbus TCP
; Сборка: pio run     Прошивка: pio run -t upload (USB)
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_extra_dirs = ../stm32/lib
lib_deps = core
lib_ldf_mode = chain
build_src_filter = +<*>
build_flags = -D USE_BLUETOOTH=1 -I../stm32/lib/core
